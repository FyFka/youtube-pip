name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/youtube-pip-button-v${{ steps.package.outputs.version }}-${{ github.run_number }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}-${{ github.run_number }}
          name: YouTube PiP Button v${{ steps.package.outputs.version }}-${{ github.run_number }}
          generate_release_notes: true
          files: release/*.zip
